<!DOCTYPE html>
<!--
  Source for img/og-cover.png (1200x630 social preview).
  Regenerate with:  node scripts/build-og.mjs
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 480px at 88% -10%, rgba(124,92,255,.32), transparent 62%),
      radial-gradient(620px 420px at -4% 18%, rgba(0,229,255,.18), transparent 60%),
      radial-gradient(760px 520px at 60% 120%, rgba(255,46,136,.16), transparent 62%),
      #05060a;
    color: #e9edf6;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    position: relative;
  }
  /* subtle dotted grid, echoing the point-cloud hero */
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,229,255,.22) 1px, transparent 1.4px);
    background-size: 26px 26px;
    -webkit-mask-image: linear-gradient(100deg, transparent 30%, #000 75%);
            mask-image: linear-gradient(100deg, transparent 30%, #000 75%);
  }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #8d95ab; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #35f0a0; box-shadow: 0 0 18px rgba(53,240,160,.7); }
  h1 {
    margin: 46px 0 14px; font-size: 118px; line-height: .92; letter-spacing: -.045em; font-weight: 700;
    background: linear-gradient(105deg, #fff 18%, #00e5ff 58%, #7c5cff 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    max-width: 760px;
  }
  .role { font-family: 'JetBrains Mono', monospace; font-size: 34px; color: #00e5ff; margin: 0 0 30px; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; max-width: 720px; }
  .chips span {
    font-family: 'JetBrains Mono', monospace; font-size: 21px; color: #c9cfdd;
    border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 8px 18px;
    background: rgba(255,255,255,.035);
  }
  .url { margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #5c6379; }
  .url b { color: #00e5ff; font-weight: 500; }
  .photo {
    position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
    width: 300px; height: 300px; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(0,229,255,.55);
    box-shadow: 0 0 0 10px rgba(0,229,255,.06), 0 0 80px rgba(124,92,255,.35);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08);
    transform: scale(1.65); transform-origin: 54% 14%; }   /* zoom on the face */
  .glyph { position: absolute; right: 92px; top: 66px; font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #7c5cff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span>Rome, Italy · 20+ years</div>
    <h1>Alain Bindele</h1>
    <p class="role">Software Engineer</p>
    <div class="chips">
      <span>Java</span><span>Spring Boot</span><span>AWS</span><span>Clean Architecture</span>
    </div>
    <div class="url"><b>alainbindele.github.io</b></div>
  </div>
  <div class="glyph">&lt;/&gt;</div>
  <div class="photo"><img src="../assets/alain.jpg" alt="" /></div>
</body>
</html>
